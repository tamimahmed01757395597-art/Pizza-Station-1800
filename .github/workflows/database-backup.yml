name: Database backup

on:
  schedule:
    # 03:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create compressed dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL repository secret is not configured." >&2
            exit 1
          fi
          mkdir -p backups
          filename="pizza-station-$(date -u +%Y%m%dT%H%M%SZ).dump.gz"
          PGSSLMODE=require pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges | gzip > "backups/$filename"
          printf 'Backup created: %s\n' "$filename"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backups/*.dump.gz
          retention-days: 14
          if-no-files-found: error

      - name: Fail the run if no dump was produced
        run: test -n "$(ls backups/*.dump.gz 2>/dev/null)"
